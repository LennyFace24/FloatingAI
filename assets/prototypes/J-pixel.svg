<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 原型 J：像素点阵 —— 8-bit 终端复古，AI 与输入条点阵化 -->
  <rect x="16" y="16" width="224" height="224" rx="36" fill="#0b0b0b" stroke="#3a3a3a" stroke-width="3"/>
  <!-- 像素 "AI"（8x10 点阵风格，用圆点） -->
  <!-- A -->
  <g fill="#e6e6e6">
    <circle cx="86" cy="62" r="4"/><circle cx="98" cy="62" r="4"/><circle cx="110" cy="62" r="4"/>
    <circle cx="80" cy="74" r="4"/><circle cx="116" cy="74" r="4"/>
    <circle cx="80" cy="86" r="4"/><circle cx="116" cy="86" r="4"/>
    <circle cx="80" cy="98" r="4"/><circle cx="116" cy="98" r="4"/>
    <circle cx="86" cy="86" r="4"/><circle cx="92" cy="86" r="4"/><circle cx="98" cy="86" r="4"/><circle cx="104" cy="86" r="4"/><circle cx="110" cy="86" r="4"/>
    <circle cx="80" cy="110" r="4"/><circle cx="116" cy="110" r="4"/>
    <circle cx="80" cy="122" r="4"/><circle cx="116" cy="122" r="4"/>
  </g>
  <!-- I -->
  <g fill="#888">
    <circle cx="152" cy="62" r="4"/>
    <circle cx="152" cy="74" r="4"/><circle cx="152" cy="86" r="4"/><circle cx="152" cy="98" r="4"/>
    <circle cx="152" cy="110" r="4"/><circle cx="152" cy="122" r="4"/>
  </g>
  <!-- 像素输入条 -->
  <rect x="36" y="162" width="184" height="48" rx="6" fill="#121212" stroke="#3a3a3a" stroke-width="2"/>
  <g fill="#3f3f3f">
    <circle cx="56" cy="180" r="3"/><circle cx="66" cy="180" r="3"/><circle cx="76" cy="180" r="3"/>
    <circle cx="86" cy="180" r="3"/><circle cx="96" cy="180" r="3"/><circle cx="106" cy="180" r="3"/><circle cx="116" cy="180" r="3"/>
  </g>
  <!-- 闪烁光标（方块） -->
  <rect x="132" y="172" width="10" height="16" fill="#e6e6e6"/>
</svg>
