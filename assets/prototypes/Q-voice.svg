<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 原型 Q：语音输入 —— 球内音频波形柱起伏，内置语音转写（STT） -->
  <rect x="16" y="16" width="224" height="224" rx="44" fill="#0d0d0d" stroke="#3a3a3a" stroke-width="3"/>
  <!-- 悬浮球：居中 -->
  <circle cx="128" cy="118" r="66" fill="#141414" stroke="#555" stroke-width="3"/>
  <!-- 音频波形柱：球内底部，中间最高 -->
  <rect x="94" y="138" width="10" height="14" rx="3" fill="#e6e6e6"/>
  <rect x="110" y="126" width="10" height="38" rx="3" fill="#e6e6e6"/>
  <rect x="126" y="132" width="10" height="26" rx="3" fill="#e6e6e6"/>
  <!-- 峰值柱（唯一亮色）：正在收音 -->
  <rect x="142" y="118" width="10" height="52" rx="3" fill="#7af08a"/>
  <rect x="158" y="130" width="10" height="30" rx="3" fill="#e6e6e6"/>
</svg>
