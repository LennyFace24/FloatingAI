<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 原型 H：雷达弧 —— 悬浮球是雷达，随时扫描接收信号 -->
  <rect x="16" y="16" width="224" height="224" rx="40" fill="#0b0b0b" stroke="#3a3a3a" stroke-width="3"/>
  <!-- 同心圆（雷达网格） -->
  <circle cx="128" cy="100" r="62" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="128" cy="100" r="44" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="128" cy="100" r="26" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- 扫描弧（签名：动感扇形） -->
  <path d="M128 100 L128 38 A62 62 0 0 1 190 100 Z" fill="#e6e6e6" fill-opacity="0.14"/>
  <path d="M128 100 L128 38 A62 62 0 0 1 154 51" fill="none" stroke="#e6e6e6" stroke-width="3" stroke-linecap="round"/>
  <!-- 信号点 -->
  <circle cx="170" cy="62" r="6" fill="#e6e6e6"/>
  <!-- 输入条 -->
  <rect x="30" y="176" width="196" height="44" rx="12" fill="#121212" stroke="#4a4a4a" stroke-width="3"/>
  <circle cx="60" cy="198" r="5" fill="#e6e6e6"/>
  <path d="M76 198 L188 198" stroke="#555" stroke-width="3" stroke-linecap="round"/>
</svg>
